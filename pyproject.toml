[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-split-ai"
version = "2.0.0"
description = "试卷 PDF 智能拆题与选题导出系统"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ExamSplit AI Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "Pillow>=10.0.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
    "jsonschema>=4.20.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "prompts*", "schemas*", "test_pic*", "resources*", "tests*", "models*", "dist*", "build*"]
